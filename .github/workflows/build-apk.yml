name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set dynamic app version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building The Register v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build
        env:
          VITE_NATIVE_API_URL: https://school-erp-x967.onrender.com/api

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Accept Android SDK licenses & build Debug APK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2 || (sleep 15 && ./gradlew assembleDebug --no-daemon --max-workers=2)

      - name: Package versioned APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "The-Register-School-ERP-v${ANDROID_VERSION_NAME}.apk"

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${ANDROID_VERSION_NAME}"
          APK_FILE="The-Register-School-ERP-v${ANDROID_VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "The Register v${ANDROID_VERSION_NAME}" \
              --notes "Automated Android APK build #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}." \
              --latest
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Register-School-ERP-v${{ env.ANDROID_VERSION_NAME }}-APK
          path: The-Register-School-ERP-v${{ env.ANDROID_VERSION_NAME }}.apk
          if-no-files-found: error
