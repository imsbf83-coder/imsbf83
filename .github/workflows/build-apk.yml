name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build
        env:
          VITE_NATIVE_API_URL: https://school-erp-x967.onrender.com/api

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Package APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk The-Register-School-ERP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Register-School-ERP-APK
          path: The-Register-School-ERP.apk
          if-no-files-found: error
